name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verimind
          POSTGRES_PASSWORD: verimind
          POSTGRES_DB: verimind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verimind" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERIMIND_TEST_DATABASE_URL: postgresql+psycopg://verimind:verimind@localhost:5432/verimind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pip-audit --skip-editable  # known vulnerabilities in dependencies
      - run: pytest

  e2e:
    # Start the real stack (app, worker, Postgres) and click through it in a browser.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" && playwright install --with-deps chromium
      - run: cp .env.example .env && bash ./start.sh
      - run: pytest tests/e2e
        env:
          VERIMIND_E2E_URL: http://127.0.0.1:8000
          E2E_BROWSER_CHANNEL: chromium
      - if: failure()
        run: docker compose logs --tail 200
